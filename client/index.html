<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open the connections to the API and the image storage early, so the
         album covers on the home page start downloading sooner. -->
    <link rel="preconnect" href="https://musicavet-api.vercel.app" crossorigin />
    <link rel="preconnect" href="https://tnopmeevynuyszzqarmk.supabase.co" />
    <link
      rel="preload"
      as="image"
      href="/singers/music_slide_1_1280.webp"
      imagesrcset="/singers/music_slide_1_768.webp 768w, /singers/music_slide_1_1280.webp 1280w, /singers/music_slide_1_1600.webp 1600w"
      imagesizes="(min-width: 1025px) calc(100vw - 268px), (min-width: 481px) calc(100vw - 48px), calc(100vw - 32px)"
      fetchpriority="high"
    />
    <!-- viewport-fit=cover: required for the env(safe-area-inset-*) values the player and layout use -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Paints the browser UI to match the app background before the CSS loads -->
    <meta name="theme-color" content="#0d0b11" />
    <meta
      name="description"
      content="MusicAvet - a music library with a global audio player, browsable by song, artist, album and genre."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://musicavet.vercel.app/" />
    <!-- Link previews (social networks, chat apps) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MusicAvet" />
    <meta property="og:title" content="MusicAvet - Music library" />
    <meta
      property="og:description"
      content="Browse songs, artists, albums and genres with a global audio player."
    />
    <meta property="og:url" content="https://musicavet.vercel.app/" />
    <meta
      property="og:image"
      content="https://musicavet.vercel.app/singers/music_slide_1_1280.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MusicAvet - Music library" />
    <meta
      name="twitter:description"
      content="Browse songs, artists, albums and genres with a global audio player."
    />
    <meta
      name="twitter:image"
      content="https://musicavet.vercel.app/singers/music_slide_1_1280.webp"
    />
    <title>MusicAvet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
