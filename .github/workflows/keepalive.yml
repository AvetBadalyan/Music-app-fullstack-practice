name: Keep Backend Warm

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping deployed API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            https://music-app-api-sa3n.onrender.com/api/genres