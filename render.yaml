services:
  - type: web
    name: music-app-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DB_LOGGING
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SONGS_BUCKET
        sync: false
      - key: SUPABASE_ALBUM_COVERS_BUCKET
        sync: false
      - key: SUPABASE_ARTIST_IMAGES_BUCKET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
